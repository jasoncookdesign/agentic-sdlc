[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc"
version = "3.0.0"
description = "A portable, contract-first software delivery lifecycle for agentic development."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jason Cook"}]
dependencies = []

[project.scripts]
agentic-sdlc = "agentic_sdlc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_sdlc = ["resources/templates/*.md"]
